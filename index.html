<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    VoiceDock | 日本大学文理学部
  </title>


  <script
    src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js">
  </script>


  <style>

    :root {

      --primary: #b7282e;
      --primary-dark: #8f1e23;
      --primary-light: #f9e9ea;

      --green: #24864b;
      --green-dark: #196437;

      --gray-dark: #333;
      --gray-light: #eeeeee;

    }


    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      padding: 28px 16px;

      display: flex;

      align-items: center;

      justify-content: center;

      background:
        radial-gradient(
          circle at top right,
          #fbeaec,
          transparent 34%
        ),
        linear-gradient(
          135deg,
          #f4f4f5,
          #ffffff
        );

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Sans",
        "Yu Gothic",
        Meiryo,
        sans-serif;

      color: var(--gray-dark);

    }


    .container {

      width: 100%;

      max-width: 580px;

    }


    .card {

      position: relative;

      background: white;

      border-radius: 22px;

      padding:
        40px
        36px
        34px;

      box-shadow:
        0 24px 60px
        rgba(0,0,0,.10);

      overflow: hidden;

    }


    .card::before {

      content: "";

      position: absolute;

      top: 0;
      left: 0;

      height: 7px;

      width: 100%;

      background:
        linear-gradient(
          90deg,
          var(--primary-dark),
          var(--primary),
          #dc5f64
        );

    }


    .university {

      text-align: center;

      font-size: 13px;

      font-weight: 700;

      color: #666;

      margin-bottom: 19px;

    }


    .brand {

      text-align: center;

      margin-bottom: 31px;

    }


    .brand-icon {

      width: 67px;

      height: 67px;

      margin:
        0 auto
        13px;

      border-radius: 20px;

      display: flex;

      align-items: center;

      justify-content: center;

      background:
        linear-gradient(
          145deg,
          var(--primary),
          var(--primary-dark)
        );

      color: white;

      font-size: 32px;

      box-shadow:
        0 10px 25px
        rgba(183,40,46,.28);

    }


    h1 {

      margin: 0;

      font-size: 36px;

      font-weight: 800;

      color: #202020;

    }


    .tagline {

      margin-top: 6px;

      color: var(--primary);

      font-size: 13px;

      font-weight: 700;

      letter-spacing: .12em;

    }


    .input-group {

      margin-bottom: 20px;

    }


    label {

      display: block;

      margin-bottom: 8px;

      font-size: 14px;

      font-weight: 700;

    }


    select,
    input {

      width: 100%;

      padding: 13px 14px;

      border:
        1px solid
        #d8d8d8;

      border-radius: 10px;

      font-size: 16px;

      background: white;

    }


    select:focus,
    input:focus {

      outline: none;

      border-color:
        var(--primary);

      box-shadow:
        0 0 0 3px
        rgba(183,40,46,.10);

    }


    .button-group {

      display: flex;

      gap: 11px;

      margin-top: 27px;

    }


    button {

      flex: 1;

      border: none;

      border-radius: 12px;

      padding: 15px 20px;

      font-size: 16px;

      font-weight: 700;

      cursor: pointer;

    }


    button:disabled {

      background:
        #dedede !important;

      color:
        #999 !important;

      cursor:
        not-allowed;

    }


    #recordButton {

      background:
        linear-gradient(
          135deg,
          var(--green),
          var(--green-dark)
        );

      color: white;

    }


    #stopButton {

      background: #606060;

      color: white;

    }


    #timer {

      text-align: center;

      margin-top: 17px;

      min-height: 28px;

      font-size: 22px;

      font-weight: 700;

      color: var(--primary);

      visibility: hidden;

    }


    #timer.active {

      visibility: visible;

    }


    #previewArea {

      display: none;

      margin-top: 25px;

      padding:
        19px
        17px;

      border-radius: 14px;

      background: #f7f7f7;

    }


    #previewArea.visible {

      display: block;

    }


    .preview-title {

      text-align: center;

      font-size: 14px;

      font-weight: 700;

      margin-bottom: 12px;

    }


    #audioPlayback {

      width: 100%;

    }


    .preview-note {

      text-align: center;

      margin-top: 9px;

      color: #777;

      font-size: 12px;

      line-height: 1.6;

    }


    .decision-buttons {

      display: flex;

      gap: 10px;

      margin-top: 16px;

    }


    #retakeButton {

      background: #666;

      color: white;

    }


    #saveButton {

      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--primary-dark)
        );

      color: white;

    }


    #status {

      margin-top: 23px;

      padding: 15px;

      border-radius: 11px;

      background: #f4f4f4;

      border-left:
        5px solid
        #999;

      text-align: center;

      font-size: 14px;

      font-weight: 600;

      line-height: 1.6;

    }


    #status.recording {

      background: #fff4f4;

      border-left-color:
        var(--primary);

      color:
        var(--primary-dark);

    }


    #status.success {

      background: #effaf3;

      border-left-color:
        var(--green);

      color:
        var(--green-dark);

    }


    #status.error {

      background: #fff0f0;

      border-left-color:
        #d63031;

      color: #a72424;

    }


    .guide {

      margin-top: 25px;

      padding: 15px 17px;

      border-radius: 11px;

      background:
        var(--primary-light);

      color: #654044;

      font-size: 12px;

      line-height: 1.7;

    }


    footer {

      margin-top: 26px;

      padding-top: 19px;

      border-top:
        1px solid
        var(--gray-light);

      text-align: center;

      color: #999;

      font-size: 11px;

      line-height: 1.7;

    }


    @media
    (max-width: 600px) {

      .card {

        padding:
          35px
          23px
          27px;

      }


      .button-group,
      .decision-buttons {

        flex-direction: column;

      }

    }

  </style>

</head>


<body>

  <main class="container">

    <section class="card">


      <div class="university">
        日本大学 文理学部
      </div>


      <header class="brand">

        <div class="brand-icon">
          🎙
        </div>

        <h1>
          VoiceDock
        </h1>

        <div class="tagline">
          RECORD · SAVE · REFLECT
        </div>

      </header>


      <div class="input-group">

        <label for="groupSelect">
          グループ
        </label>

        <select id="groupSelect">

          <option value="">
            -- 選択してください --
          </option>

        </select>

      </div>


      <div class="input-group">

        <label for="nicknameInput">
          お名前
        </label>

        <input
          type="text"
          id="nicknameInput"
          placeholder="例：野中"
        >

      </div>


      <div class="button-group">

        <button id="recordButton">
          🎙 録音開始
        </button>

        <button
          id="stopButton"
          disabled
        >
          ■ 停止
        </button>

      </div>


      <div id="timer">
        00:00
      </div>


      <div id="previewArea">

        <div class="preview-title">
          🎧 録音内容を確認
        </div>

        <audio
          id="audioPlayback"
          controls
        ></audio>

        <div class="preview-note">

          音声を聞いて確認してください。<br>
          問題があれば録り直すことができます。

        </div>


        <div class="decision-buttons">

          <button id="retakeButton">
            ↻ 録り直す
          </button>

          <button id="saveButton">
            💾 保存する
          </button>

        </div>

      </div>


      <div id="status">

        グループと名前を入力して、
        録音を始めてください。

      </div>


      <div class="guide">

        <strong>使い方</strong><br>

        ① グループと名前を入力<br>
        ② 「録音開始」<br>
        ③ 「停止」<br>
        ④ 自分の音声を聞いて確認<br>
        ⑤ 必要なら録り直す<br>
        ⑥ 問題なければ保存

      </div>


      <footer>

        <strong>
          VoiceDock
        </strong>

        <br>

        Nihon University<br>

        College of Humanities and Sciences

      </footer>


    </section>

  </main>


  <script>

    const GAS_API_URL =
      "https://script.google.com/a/macros/nihon-u.ac.jp/s/AKfycbys9pKSHqcbZ4SAx8wU99cl7QvzXL23PPx1zHdHMPLQZUTB4E-JJcpxJQVZ0qpNaKiXCg/exec";


    const recordButton =
      document.getElementById(
        "recordButton"
      );

    const stopButton =
      document.getElementById(
        "stopButton"
      );

    const retakeButton =
      document.getElementById(
        "retakeButton"
      );

    const saveButton =
      document.getElementById(
        "saveButton"
      );

    const statusDisplay =
      document.getElementById(
        "status"
      );

    const audioPlayback =
      document.getElementById(
        "audioPlayback"
      );

    const previewArea =
      document.getElementById(
        "previewArea"
      );

    const groupSelect =
      document.getElementById(
        "groupSelect"
      );

    const nicknameInput =
      document.getElementById(
        "nicknameInput"
      );

    const timerDisplay =
      document.getElementById(
        "timer"
      );


    // グループ1〜50

    for (
      let i = 1;
      i <= 50;
      i++
    ) {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        String(i);

      option.textContent =
        "グループ " + i;

      groupSelect.appendChild(
        option
      );

    }


    let mediaRecorder = null;

    let audioChunks = [];

    let originalAudioBlob = null;

    let stream = null;

    let timerInterval = null;

    let recordingStartTime = null;

    let currentAudioUrl = null;


    function setStatus(
      message,
      type = ""
    ) {

      statusDisplay.textContent =
        message;

      statusDisplay.className =
        type;

    }


    function startTimer() {

      recordingStartTime =
        Date.now();

      timerDisplay.classList.add(
        "active"
      );

      timerDisplay.textContent =
        "00:00";


      timerInterval =
        setInterval(
          () => {

            const elapsed =
              Math.floor(
                (
                  Date.now()
                  -
                  recordingStartTime
                )
                /
                1000
              );


            const minutes =
              Math.floor(
                elapsed / 60
              );


            const seconds =
              elapsed % 60;


            timerDisplay.textContent =
              String(minutes)
                .padStart(
                  2,
                  "0"
                )
              +
              ":"
              +
              String(seconds)
                .padStart(
                  2,
                  "0"
                );

          },
          500
        );

    }


    function stopTimer() {

      if (timerInterval) {

        clearInterval(
          timerInterval
        );

        timerInterval = null;

      }

    }


    async function beginRecording() {

      const groupValue =
        groupSelect
          .value
          .trim();


      const nicknameValue =
        nicknameInput
          .value
          .trim();


      if (!groupValue) {

        setStatus(
          "グループを選択してください。",
          "error"
        );

        return;

      }


      if (!nicknameValue) {

        setStatus(
          "お名前を入力してください。",
          "error"
        );

        return;

      }


      try {

        if (currentAudioUrl) {

          URL.revokeObjectURL(
            currentAudioUrl
          );

          currentAudioUrl = null;

        }


        previewArea.classList.remove(
          "visible"
        );


        originalAudioBlob = null;

        audioChunks = [];


        stream =
          await navigator
            .mediaDevices
            .getUserMedia({
              audio: true
            });


        const options = {

          mimeType:
            "audio/webm;codecs=opus"

        };


        if (
          !MediaRecorder
            .isTypeSupported(
              options.mimeType
            )
        ) {

          delete options.mimeType;

        }


        mediaRecorder =
          new MediaRecorder(
            stream,
            options
          );


        mediaRecorder
          .ondataavailable =
            event => {

              if (
                event.data
                &&
                event.data.size > 0
              ) {

                audioChunks.push(
                  event.data
                );

              }

            };


        mediaRecorder.onstop =
          () => {

            originalAudioBlob =
              new Blob(
                audioChunks,
                {
                  type:
                    mediaRecorder.mimeType
                }
              );


            currentAudioUrl =
              URL.createObjectURL(
                originalAudioBlob
              );


            audioPlayback.src =
              currentAudioUrl;


            previewArea
              .classList
              .add(
                "visible"
              );


            recordButton.disabled =
              false;


            stopButton.disabled =
              true;


            groupSelect.disabled =
              false;


            nicknameInput.disabled =
              false;


            setStatus(
              "録音が終了しました。音声を聞いて確認してください。",
              "success"
            );

          };


        mediaRecorder.start();


        startTimer();


        setStatus(
          "録音中です。お話しください。",
          "recording"
        );


        recordButton.disabled =
          true;


        stopButton.disabled =
          false;


        groupSelect.disabled =
          true;


        nicknameInput.disabled =
          true;

      }


      catch (error) {

        console.error(
          error
        );


        setStatus(
          "マイクを使用できません。ブラウザの設定を確認してください。",
          "error"
        );

      }

    }


    recordButton.onclick =
      beginRecording;


    stopButton.onclick =
      () => {

        if (
          mediaRecorder
          &&
          mediaRecorder.state !==
            "inactive"
        ) {

          mediaRecorder.stop();

        }


        stopTimer();


        if (stream) {

          stream
            .getTracks()
            .forEach(
              track =>
                track.stop()
            );


          stream = null;

        }

      };


    retakeButton.onclick =
      () => {

        if (currentAudioUrl) {

          URL.revokeObjectURL(
            currentAudioUrl
          );

          currentAudioUrl = null;

        }


        originalAudioBlob =
          null;


        audioPlayback.src =
          "";


        previewArea
          .classList
          .remove(
            "visible"
          );


        timerDisplay.textContent =
          "00:00";


        timerDisplay
          .classList
          .remove(
            "active"
          );


        setStatus(
          "録り直しできます。「録音開始」を押してください。"
        );

      };


    saveButton.onclick =
      async () => {

        if (!originalAudioBlob) {

          return;

        }


        const groupValue =
          groupSelect
            .value
            .trim();


        const nicknameValue =
          nicknameInput
            .value
            .trim();


        // 保存結果用の新規タブ
        const resultWindow =
          window.open(
            "",
            "VoiceDockSaveResult"
          );


        if (resultWindow) {

          resultWindow.document.write(`
            <!DOCTYPE html>
            <html lang="ja">
            <head>
              <meta charset="UTF-8">
              <title>VoiceDock</title>
            </head>
            <body
              style="
                font-family:sans-serif;
                text-align:center;
                padding:60px 20px;
              "
            >
              <h2>VoiceDock</h2>
              <p>
                録音データを準備しています…
              </p>
            </body>
            </html>
          `);

          resultWindow.document.close();

        }


        setStatus(
          "MP3形式に変換しています…"
        );


        saveButton.disabled =
          true;


        retakeButton.disabled =
          true;


        try {

          const mp3Blob =
            await encodeToMp3(
              originalAudioBlob
            );


          const audioDataUrl =
            await blobToDataUrl(
              mp3Blob
            );


          const timestamp =
            new Date()
              .toISOString()
              .replace(
                /[:.]/g,
                "-"
              );


          const safeNickname =
            nicknameValue
              .replace(
                /[\s\\\/:*?"<>|]/g,
                "_"
              );


          const baseFileName =
            "グループ"
            +
            groupValue
            +
            "_"
            +
            safeNickname
            +
            "_"
            +
            timestamp;


          setStatus(
            "Google Driveへ保存しています…"
          );


          const form =
            document.createElement(
              "form"
            );


          form.method =
            "POST";


          form.action =
            GAS_API_URL;


          form.target =
            resultWindow
              ?
              "VoiceDockSaveResult"
              :
              "_self";


          form.style.display =
            "none";


          function addHidden(
            name,
            value
          ) {

            const input =
              document.createElement(
                "input"
              );

            input.type =
              "hidden";

            input.name =
              name;

            input.value =
              value;

            form.appendChild(
              input
            );

          }


          addHidden(
            "transport",
            "form"
          );


          addHidden(
            "audioData",
            audioDataUrl
          );


          addHidden(
            "fileName",
            baseFileName
          );


          document.body.appendChild(
            form
          );


          form.submit();


          setStatus(
            "保存結果を別画面で確認してください。",
            "success"
          );


          setTimeout(
            () => {

              form.remove();

            },
            3000
          );

        }


        catch (error) {

          console.error(
            error
          );


          if (
            resultWindow
            &&
            !resultWindow.closed
          ) {

            resultWindow.close();

          }


          setStatus(
            "保存準備中にエラーが発生しました："
            +
            error.message,
            "error"
          );


          saveButton.disabled =
            false;


          retakeButton.disabled =
            false;

        }

      };


    function blobToDataUrl(
      blob
    ) {

      return new Promise(
        (
          resolve,
          reject
        ) => {

          const reader =
            new FileReader();


          reader.onloadend =
            () =>
              resolve(
                reader.result
              );


          reader.onerror =
            () =>
              reject(
                new Error(
                  "音声データの変換に失敗しました。"
                )
              );


          reader.readAsDataURL(
            blob
          );

        }
      );

    }


    async function encodeToMp3(
      audioBlob
    ) {

      const AudioContextClass =
        window.AudioContext
        ||
        window.webkitAudioContext;


      const audioContext =
        new AudioContextClass();


      try {

        const arrayBuffer =
          await audioBlob
            .arrayBuffer();


        const audioBuffer =
          await audioContext
            .decodeAudioData(
              arrayBuffer
            );


        const numChannels =
          audioBuffer
            .numberOfChannels;


        const sampleRate =
          audioBuffer
            .sampleRate;


        const mp3encoder =
          new lamejs.Mp3Encoder(
            numChannels,
            sampleRate,
            128
          );


        const mp3Data =
          [];


        const left =
          audioBuffer
            .getChannelData(0);


        const right =
          numChannels > 1
            ?
            audioBuffer
              .getChannelData(1)
            :
            null;


        function floatToInt16(
          floatSamples
        ) {

          const intSamples =
            new Int16Array(
              floatSamples.length
            );


          for (
            let i = 0;
            i < floatSamples.length;
            i++
          ) {

            const s =
              Math.max(
                -1,
                Math.min(
                  1,
                  floatSamples[i]
                )
              );


            intSamples[i] =
              s < 0
                ?
                s * 0x8000
                :
                s * 0x7FFF;

          }


          return intSamples;

        }


        const samplesLeft =
          floatToInt16(
            left
          );


        const samplesRight =
          right
            ?
            floatToInt16(
              right
            )
            :
            null;


        const blockSize =
          1152;


        if (
          numChannels === 2
        ) {

          for (
            let i = 0;
            i < samplesLeft.length;
            i += blockSize
          ) {

            const mp3buf =
              mp3encoder
                .encodeBuffer(
                  samplesLeft.subarray(
                    i,
                    i + blockSize
                  ),
                  samplesRight.subarray(
                    i,
                    i + blockSize
                  )
                );


            if (
              mp3buf.length > 0
            ) {

              mp3Data.push(
                new Uint8Array(
                  mp3buf
                )
              );

            }

          }

        }


        else {

          for (
            let i = 0;
            i < samplesLeft.length;
            i += blockSize
          ) {

            const mp3buf =
              mp3encoder
                .encodeBuffer(
                  samplesLeft.subarray(
                    i,
                    i + blockSize
                  )
                );


            if (
              mp3buf.length > 0
            ) {

              mp3Data.push(
                new Uint8Array(
                  mp3buf
                )
              );

            }

          }

        }


        const flush =
          mp3encoder.flush();


        if (
          flush.length > 0
        ) {

          mp3Data.push(
            new Uint8Array(
              flush
            )
          );

        }


        return new Blob(
          mp3Data,
          {
            type:
              "audio/mpeg"
          }
        );

      }


      finally {

        await audioContext.close();

      }

    }

  </script>

</body>

</html>
